name: Run and Save Notebook

on:
  push:
    branches: [run-notebooks]
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ipykernel install --user --name python3

      - name: Execute All Notebooks
        run: |
          mkdir -p output
          for notebook in input/*.ipynb; do
            filename=$(basename "$notebook")
            echo "Running $filename..."
            papermill "$notebook" "output/$filename" -k python3
          done

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/*.ipynb
          git commit -m "Automated batch experiment results: $(date)" || echo "No changes to commit"
          git push
