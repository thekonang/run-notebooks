name: Run and Save Notebook

on:
  push:
    branches: [main]
    paths:
      - "input/**"
      - "requirements.txt"
      - ".github/workflows/run-and-save-notebook.yml"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Python virtualenv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ "${{ steps.venv-cache.outputs.cache-hit }}" != "true" ]; then
            pip install -r requirements.txt
            # PyG compiled extensions (torch-cluster/torch-scatter/torch-sparse) are
            # required by SchNet's radius_graph and must come from the PyG wheel
            # index matching the installed torch version.
            TORCH_VER=$(python -c "import torch, re; print(re.sub(r'\+.*$', '', torch.__version__))")
            PYG_INDEX="https://data.pyg.org/whl/torch-${TORCH_VER}+cpu.html"
            echo "Installing PyG extensions from $PYG_INDEX"
            pip install torch-cluster torch-scatter torch-sparse -f "$PYG_INDEX"
          else
            echo "venv cache hit — skipping pip install"
          fi
          python -m ipykernel install --user --name python3
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache notebook data (TDC + conformer pickles)
        uses: actions/cache@v4
        with:
          path: data
          key: notebook-data-v1-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            notebook-data-v1-

      - name: Execute All Notebooks
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p output
          notebooks=(input/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks found in input/. Skipping execution."
          else
            for notebook in "${notebooks[@]}"; do
              filename=$(basename "$notebook")
              echo "Running $filename..."
              papermill "$notebook" "output/$filename" -k python3
            done
          fi

      - name: Commit and Push Results
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated notebook execution results: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
