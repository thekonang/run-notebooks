name: Run and Save Notebook

on:
  push:
    branches: [main]
    paths:
      - "input/**"
      - "requirements.txt"
      - ".github/workflows/run-and-save-notebook.yml"
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m ipykernel install --user --name python3

      - name: Execute All Notebooks
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p output
          notebooks=(input/*.ipynb)
          if [ ${#notebooks[@]} -eq 0 ]; then
            echo "No notebooks found in input/. Skipping execution."
          else
            for notebook in "${notebooks[@]}"; do
              filename=$(basename "$notebook")
              echo "Running $filename..."
              papermill "$notebook" "output/$filename" -k python3
            done
          fi

      - name: Commit and Push Results
        run: |
          set -euo pipefail
          shopt -s nullglob
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A output/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated notebook execution results: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
